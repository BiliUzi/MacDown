name: Build MacDown

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4

    - name: Fetch Prism dependency
      uses: actions/checkout@v4
      with:
        repository: PrismJS/prism
        ref: bd479f1d5ff0855b4c50168c1a82c91b2db191f2
        path: Dependency/prism

    - name: Install CocoaPods
      run: brew list cocoapods >/dev/null 2>&1 || brew install cocoapods

    - name: Install pods
      run: pod install

    - name: Generate Markdown parser
      run: |
        make -C Dependency/peg-markdown-highlight -j$(sysctl -n hw.ncpu)

    - name: Build MacDown
      run: |
        xcodebuild \
          -workspace MacDown.xcworkspace \
          -scheme MacDown \
          -configuration Release \
          -arch arm64 \
          -derivedDataPath build \
          CODE_SIGNING_ALLOWED=NO \
          build

    - name: Check pane collapse and restoration
      run: |
        xcrun clang -fobjc-arc -framework Cocoa -I MacDown/Code/View \
          MacDown/Code/View/MPDocumentSplitView.m Tools/check_split_view.m \
          -o "$RUNNER_TEMP/check-split-view"
        "$RUNNER_TEMP/check-split-view"

    - name: Locate built app
      run: |
        find build -name "MacDown.app" -type d

    - name: Check retained theme resources
      run: |
        python3 - <<'PY'
        from pathlib import Path
        import hashlib
        resources = Path('build/Build/Products/Release/MacDown.app/Contents/Resources')
        expected = {
            'Themes': ('Solarized (Light)+.style', '30751252517c8d159fbc8c30af5387199c96bdb5b86a817f0f9bfc07d52212a4'),
            'Styles': ('GitHub2-Elegant.css', 'e8eae58e7ac4e4bd7c5ce4ed14f3c7191f8ff61d87d50c8ae3bf95bbf1fc0419'),
        }
        for directory, (name, digest) in expected.items():
            folder = resources / directory
            assert sorted(p.name for p in folder.iterdir()) == [name], directory
            assert hashlib.sha256((folder / name).read_bytes()).hexdigest() == digest, name
        PY

    - name: Sign and verify application
      run: |
        codesign --force --deep --sign - build/Build/Products/Release/MacDown.app
        codesign --verify --deep --strict --verbose=2 build/Build/Products/Release/MacDown.app

    - name: Check first launch
      run: |
        build/Build/Products/Release/MacDown.app/Contents/MacOS/MacDown -ApplePersistenceIgnoreState YES > "$RUNNER_TEMP/macdown-startup.log" 2>&1 &
        app_pid=$!
        sleep 10
        if ! kill -0 "$app_pid" 2>/dev/null; then
          cat "$RUNNER_TEMP/macdown-startup.log"
          exit 1
        fi
        defaults export io.github.biliuzi.MacDown "$RUNNER_TEMP/macdown-defaults.plist"
        python3 - "$RUNNER_TEMP/macdown-defaults.plist" <<'PY'
        import plistlib, sys
        with open(sys.argv[1], 'rb') as stream:
            prefs = plistlib.load(stream)
        assert prefs['editorBaseFontInfo'] == {'name': 'Futura-Medium', 'size': 14}
        assert prefs['editorHorizontalInset'] == prefs['editorVerticalInset'] == 10
        assert prefs['editorLineSpacing'] == 5
        assert prefs['editorMaximumWidth'] == 1000
        assert prefs['editorStyleName'] == 'Solarized (Light)+'
        assert prefs['htmlStyleName'] == 'GitHub2-Elegant'
        for key in ('extensionAutolink', 'extensionSuperscript', 'extensionQuote',
                    'extensionSmartyPants', 'editorWidthLimited', 'editorConvertTabs',
                    'editorCompleteMatchingCharacters', 'editorScrollsPastEnd',
                    'htmlSyntaxHighlighting', 'htmlLineNumbers', 'htmlGraphviz',
                    'htmlMermaid', 'htmlTaskList', 'htmlDetectFrontMatter',
                    'htmlRendersTOC', 'htmlHardWrap', 'previewZoomRelativeToBaseFontSize'):
            assert prefs[key], key
        PY
        kill "$app_pid"
        wait "$app_pid" || true

    - name: Create DMG
      run: |
        mkdir dmg-stage
        ditto build/Build/Products/Release/MacDown.app dmg-stage/MacDown.app
        ln -s /Applications dmg-stage/Applications
        hdiutil create -volname "MacDown" \
          -srcfolder dmg-stage \
          -ov -format UDZO MacDown.dmg

    - name: Archive application
      run: ditto -c -k --sequesterRsrc --keepParent build/Build/Products/Release/MacDown.app MacDown.zip

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: MacDown-build
        path: |
          MacDown.zip
          MacDown.dmg
        if-no-files-found: error


  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4

    - name: Download build artifact
      uses: actions/download-artifact@v4
      with:
        name: MacDown-build
        path: dist

    - name: Publish GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "$GITHUB_REF_NAME" dist/MacDown.dmg dist/MacDown.zip \
          --title "MacDown $GITHUB_REF_NAME" \
          --generate-notes
