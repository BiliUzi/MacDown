name: Build MacDown

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4

    - name: Fetch Prism dependency
      uses: actions/checkout@v4
      with:
        repository: PrismJS/prism
        ref: bd479f1d5ff0855b4c50168c1a82c91b2db191f2
        path: Dependency/prism

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install CocoaPods
      run: brew list cocoapods >/dev/null 2>&1 || brew install cocoapods

    - name: Install pods
      run: pod install

    - name: Generate styles and Markdown parser
      run: |
        npm ci --prefix Tools/GitHub-style-generator
        make -C Tools/GitHub-style-generator
        make -C Dependency/peg-markdown-highlight -j$(sysctl -n hw.ncpu)

    - name: Build MacDown
      run: |
        xcodebuild \
          -workspace MacDown.xcworkspace \
          -scheme MacDown \
          -configuration Release \
          -arch arm64 \
          -derivedDataPath build \
          CODE_SIGNING_ALLOWED=NO \
          build

    - name: Locate built app
      run: |
        find build -name "MacDown.app" -type d

    - name: Sign and verify application
      run: |
        codesign --force --deep --sign - build/Build/Products/Release/MacDown.app
        codesign --verify --deep --strict --verbose=2 build/Build/Products/Release/MacDown.app

    - name: Check first launch
      run: |
        build/Build/Products/Release/MacDown.app/Contents/MacOS/MacDown -ApplePersistenceIgnoreState YES > "$RUNNER_TEMP/macdown-startup.log" 2>&1 &
        app_pid=$!
        sleep 10
        if ! kill -0 "$app_pid" 2>/dev/null; then
          cat "$RUNNER_TEMP/macdown-startup.log"
          exit 1
        fi
        kill "$app_pid"
        wait "$app_pid" || true

    - name: Create DMG
      run: |
        mkdir dmg-stage
        ditto build/Build/Products/Release/MacDown.app dmg-stage/MacDown.app
        ln -s /Applications dmg-stage/Applications
        hdiutil create -volname "MacDown" \
          -srcfolder dmg-stage \
          -ov -format UDZO MacDown.dmg

    - name: Archive application
      run: ditto -c -k --sequesterRsrc --keepParent build/Build/Products/Release/MacDown.app MacDown.zip

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: MacDown-build
        path: |
          MacDown.zip
          MacDown.dmg
        if-no-files-found: error


  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4

    - name: Download build artifact
      uses: actions/download-artifact@v4
      with:
        name: MacDown-build
        path: dist

    - name: Publish GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "$GITHUB_REF_NAME" dist/MacDown.dmg dist/MacDown.zip \
          --title "MacDown $GITHUB_REF_NAME" \
          --generate-notes
